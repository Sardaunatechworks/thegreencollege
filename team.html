<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Our Team | The Green College Jos</title><link rel="stylesheet" href="css/style.css"><script src="js/app.js"></script></head><body><script>header()</script><main class="wrap"><h1>Our Team</h1><p>Each profile shows a passport photograph, the staff member's role and the class they handle.</p><form onsubmit="event.preventDefault();addTeamMember(event)"><label>Full name</label><input name="name" placeholder="e.g. Mr. Full Name" required><label>Position / role</label><input name="role" placeholder="e.g. Principal, Class Teacher, Bursar" required><label>Class</label><input name="cls" list="class-list" placeholder="e.g. Primary 3, JSS 2, SS 1, or Administration" required><datalist id="class-list"><option value="Nursery 1"><option value="Nursery 2"><option value="Nursery 3"><option value="Primary 1"><option value="Primary 2"><option value="Primary 3"><option value="Primary 4"><option value="Primary 5"><option value="Primary 6"><option value="JSS 1"><option value="JSS 2"><option value="JSS 3"><option value="SS 1"><option value="SS 2"><option value="SS 3"><option value="Madrasah"><option value="Administration"></datalist><label>Passport photograph</label><input type="file" accept="image/*" required><p class="muted" style="margin:6px 0 0;font-size:13px">The photo is automatically resized to the standard passport size (4:5).</p><button class="btn" style="margin-top:12px">Add team profile</button></form><div id="team-list" class="grid team" style="margin-top:24px"></div></main><script>footer()</script><script>renderTeam();</script></body></html>
