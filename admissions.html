<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admissions | The Green College Jos</title><link rel="stylesheet" href="css/style.css"><script src="js/app.js"></script></head><body><script>header()</script><main class="wrap"><h1>Admissions</h1><div class="formbox"><form onsubmit="applyAdmission(event)"><h2>Online Admission Application</h2><label>Applicant full name</label><input name="name" required><label>Date of birth</label><input name="dob" type="date" required><label>Class applying for</label><select name="class"><option>JSS 1</option><option>JSS 2</option><option>JSS 3</option><option>SS 1</option><option>SS 2</option><option>SS 3</option></select><label>Parent / guardian name</label><input name="guardian" required><label>Phone number</label><input name="phone" required><label>Email</label><input name="email" type="email"><button class="btn">Submit application</button><p id="msg" class="note"></p></form><p class="note">Application fee: amount and payment are placeholders for demonstration. No payment is processed.</p></div></main><script>footer()</script><script></script></body></html>
