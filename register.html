<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Account | The Green College Jos</title><link rel="stylesheet" href="css/style.css"><script src="js/app.js"></script></head><body><script>header()</script><main class="wrap"><div class="formbox"><form onsubmit="register(event)"><h1>Create Portal Account</h1><p class="note">For demonstration use only. Choosing Administrator is not secure and must not be used for a real school system.</p><label>Full name</label><input name="name" required><label>Email</label><input name="email" type="email" required><label>Password</label><input name="password" type="password" minlength="4" required><label>Account role</label><select name="role"><option value="student">Student</option><option value="staff">Staff</option><option value="admin">Administrator (demo only)</option></select><button class="btn">Create account</button><p id="msg"></p></form></div></main><script>footer()</script><script></script></body></html>
